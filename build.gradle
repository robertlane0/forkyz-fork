// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

plugins {
    id 'androidx.room' version "$roomVersion" apply false
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
    id 'com.google.devtools.ksp' version '2.2.20-2.0.2' apply false
    id 'com.google.protobuf' version '0.9.5' apply false
    id 'io.github.goooler.shadow' version '8.1.8' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlinVersion" apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version "$kotlinVersion" apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version "$kotlinVersion" apply false
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:fallthrough"
            options.compilerArgs << "-Xmaxerrs" << "5"
            options.compilerArgs << "-Xmaxwarns" << "5"
        }
    }
}

