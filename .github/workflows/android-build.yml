name: Android debug APK

# Builds the Android debug APK for this fork only:
# https://github.com/robertlane0/forkyz-fork/
#
# Release builds and the Flatpak/Linux/Windows targets stay in .gitlab-ci.yml
# for the upstream project. This workflow intentionally builds debug variants
# only, so no release signing secrets are required.
#
# Each successful push/manual run publishes a pre-release containing the debug
# APK. Pull request runs only upload a workflow artifact, since fork PRs have a
# read-only token and should not create releases.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: forkyz-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        id: create-release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APK_PATH: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          TAG: debug-build-${{ github.run_number }}-${{ github.run_attempt }}
          TITLE: Debug build ${{ github.run_number }}.${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Automatic Android debug APK build from `%s` on `%s`.\n\nWorkflow run: %s\n' \
            "$COMMIT_SHA" "$REF_NAME" "$RUN_URL" > release-notes.md
          release_url=$(gh release create "$TAG" \
            --repo "$REPO" \
            "${APK_PATH}#Forkyz Android debug APK" \
            --target "$COMMIT_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --prerelease)
          echo "release-url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Add download links to summary
        if: success()
        env:
          ARTIFACT_URL: ${{ steps.upload-apk.outputs.artifact-url }}
          RELEASE_URL: ${{ steps.create-release.outputs.release-url }}
        run: |
          {
            echo "### Android debug APK"
            echo ""
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- [Workflow artifact]($ARTIFACT_URL)"
            fi
            if [ -n "$RELEASE_URL" ]; then
              echo "- [GitHub release]($RELEASE_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
