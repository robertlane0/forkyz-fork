name: Android debug APK

# Builds the Android debug APK for this fork only:
# https://github.com/robertlane0/forkyz-fork/
#
# Release builds and the Flatpak/Linux/Windows targets stay in .gitlab-ci.yml
# for the upstream project. This workflow intentionally builds debug variants
# only, so no release signing secrets are required.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        id: upload-apk
        uses: actions/upload-artifact@v7
        with:
          name: forkyz-android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add artifact link to summary
        if: success()
        run: |
          {
            echo "### Android debug APK"
            echo ""
            echo "[Download the debug APK](${{ steps.upload-apk.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
