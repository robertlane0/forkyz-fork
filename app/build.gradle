
import org.jetbrains.compose.desktop.application.dsl.TargetFormat
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'androidx.room'
    id 'com.android.application'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
    id 'com.squareup.wire'
}

kotlin {
    androidTarget {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
            // Multiplatform Parcelize from
            // https://developer.android.com/kotlin/parcelize
            freeCompilerArgs.addAll(
                "-P",
                "plugin:org.jetbrains.kotlin.parcelize:additionalAnnotation=app.crossword.yourealwaysbe.forkyz.util.Parcelize"
            )
        }
    }

    jvm { }

    sourceSets {
        def lifecycle_version = "2.9.4"

        commonMain.dependencies {
            implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
            implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
            implementation "androidx.room:room-runtime:$roomVersion"
            implementation "io.coil-kt.coil3:coil-compose:3.3.0"
            implementation "io.coil-kt.coil3:coil-network-ktor3:3.3.0"
            implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
            implementation 'androidx.concurrent:concurrent-futures:1.3.0'
            implementation 'androidx.datastore:datastore-core-okio:1.2.0'
            implementation 'be.digitalia.compose.htmlconverter:htmlconverter:1.1.0'
            implementation 'com.github.jgraham0325:words-to-numbers:8a97d258fd'
            implementation 'io.github.darkokoa:datetime-wheel-picker:1.1.0-alpha05-compose1.9'
            implementation 'io.insert-koin:koin-compose'
            implementation 'io.insert-koin:koin-compose-viewmodel'
            implementation 'io.insert-koin:koin-compose-viewmodel-navigation'
            implementation 'org.apache.httpcomponents.client5:httpclient5:5.5.1'
            implementation 'org.jetbrains.androidx.navigation:navigation-compose:2.9.1'
            implementation 'org.jetbrains.androidx.navigationevent:navigationevent-compose:1.0.0-rc02'
            implementation 'org.jetbrains.compose.components:components-resources:1.9.3'
            implementation 'org.jetbrains.compose.foundation:foundation:1.9.3'
            implementation 'org.jetbrains.compose.material3:material3:1.11.0-alpha01'
            implementation 'org.jetbrains.compose.material:material-icons-extended:1.7.3'
            implementation 'org.jetbrains.compose.material:material:1.9.3'
            implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.4.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.7.1'
            implementation(platform('io.insert-koin:koin-bom:4.1.1'))

            implementation project(path: ":puzlib", configuration: 'shadow')
        }

        androidMain.dependencies {
            // 2.10.0 has a bug maybe that prevents background threads in
            // workers from accessing the network
            // https://issuetracker.google.com/issues/387656869
            def work_version = "2.9.1"

            implementation "androidx.work:work-runtime:$work_version"
            implementation "io.ktor:ktor-client-android:3.3.2"
            implementation 'androidx.activity:activity-compose:1.12.1'
            implementation 'androidx.activity:activity-ktx:1.12.1'
            implementation 'androidx.appcompat:appcompat:1.7.1'
            implementation 'androidx.core:core-ktx:1.17.0'
            implementation 'androidx.preference:preference-ktx:1.2.1'
            // mainly replaced by
            // org.jetbrains.compose.material:material but a few bits still
            // needed for Android specific theming. E.g. themes.xml.
            implementation 'com.google.android.material:material:1.13.0'
            implementation 'com.squareup:seismic:1.0.3'
            implementation 'io.insert-koin:koin-androidx-workmanager'
        }

        androidUnitTest.dependencies {
            implementation 'androidx.arch.core:core-testing:2.2.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
            implementation 'junit:junit:4.13.2'
            // thanks https://stackoverflow.com/a/30759769
            implementation 'org.json:json:20080701'
            implementation 'org.mockito:mockito-core:5.20.0'
            implementation 'org.robolectric:robolectric:4.16'
        }

        jvmMain.dependencies {
            //pick whether to build just for the local environment, for
            //a large jar for everyone (the latter is about 30mb larger)
            //implementation(compose.desktop.currentOs)
            implementation(compose.desktop.macos_arm64)
            implementation(compose.desktop.windows_x64)
            implementation(compose.desktop.linux_x64)
            implementation 'androidx.sqlite:sqlite-bundled:2.6.2'
            implementation 'io.ktor:ktor-client-java:3.3.2'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.10.2'

            // thanks https://stackoverflow.com/a/30759769
            implementation 'org.json:json:20080701'
        }
    }

    compilerOptions.freeCompilerArgs.add("-Xexpect-actual-classes")
}

android {
    namespace = 'app.crossword.yourealwaysbe.forkyz'
    compileSdk = 36

    defaultConfig {
        applicationId = 'app.crossword.yourealwaysbe.forkyz'
        minSdk = 23
        targetSdk = 36
        multiDexEnabled = true
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    compileOptions.with {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    signingConfigs {
        release {
            storeFile getReleaseKeyStoreFile()
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android.txt"),
                          "proguard-rules.pro"
        }
    }

    // overrides 4.11 dependency of 
    // com.github.jgraham0325:words-to-numbers:8a97d258fd'
    configurations.all {
        resolutionStrategy.force 'junit:junit:4.13.2'
    }

    // needed with httpclient5-fluent
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

File getReleaseKeyStoreFile() {
    String filename = System.getenv('ANDROID_KEY_STOREFILE')
    return filename ? file(filename) : null
}

dependencies {
    kspAndroid "androidx.room:room-compiler:$roomVersion"
    kspJvm "androidx.room:room-compiler:$roomVersion"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

wire {
    kotlin {}
    sourcePath {
        srcDir("src/commonMain/proto")
    }
}

compose.resources {
    packageOfResClass = "app.crossword.yourealwaysbe.forkyz.app.generated.resources"
}

compose.desktop {
    application {
        mainClass = "app.crossword.yourealwaysbe.forkyz.MainKt"
        nativeDistributions {
            targetFormats(TargetFormat.Dmg, TargetFormat.Msi, TargetFormat.Deb)
            packageName = "app.crossword.yourealwaysbe.forkyz"
            packageVersion = "1.0.0"
        }
        buildTypes.release.proguard {
            obfuscate.set(false)
            configurationFiles.from(project.file("compose-desktop.pro"))
        }
    }
}

