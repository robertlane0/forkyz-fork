
plugins {
    id 'com.android.application'
    id 'checkstyle'
    id 'com.google.dagger.hilt.android'
}

check.dependsOn 'checkstyle'

task checkstyle(type: Checkstyle) {
    configFile file("${project.rootDir}/config/checkstyle/checkstyle.xml")
    source 'src'
    include '**/*.java'
    exclude '**/build/**'

    classpath = files()
}

android {
    dataBinding.enabled = true

    compileSdkVersion 34

    lintOptions {
        abortOnError false
    }

    defaultConfig {
        applicationId "app.crossword.yourealwaysbe.forkyz"
        namespace "app.crossword.yourealwaysbe.forkyz"
        minSdkVersion 21
        targetSdkVersion 34
        multiDexEnabled true
        vectorDrawables {
            useSupportLibrary true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas".toString()
                ]
            }
        }
    }

    compileOptions.with {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    signingConfigs {
        release {
            storeFile getReleaseKeyStoreFile()
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    tasks.withType(JavaCompile) {
        configure(options) {
            // -processing as adding room annotation processor library
            // causes warnings about unprocessed annotations for an
            // unclear reason
            options.compilerArgs << '-Xlint:all' << '-Xlint:-processing'
        }
    }

    // overrides 4.11 dependency of 
    // com.github.jgraham0325:words-to-numbers:8a97d258fd'
    configurations.all {
        resolutionStrategy.force 'junit:junit:4.13.2'
    }

    // needed with httpclient5-fluent
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

File getReleaseKeyStoreFile() {
    String filename = System.getenv('ANDROID_KEY_STOREFILE')
    return filename ? file(filename) : null
}

dependencies {
    def lifecycle_version = "2.8.5"
    def room_version = "2.6.1"
    def work_version = "2.9.1"
    def hilt_version = "2.51"

    implementation "androidx.concurrent:concurrent-futures:1.2.0"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.work:work-runtime:$work_version"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.3'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.github.jgraham0325:words-to-numbers:8a97d258fd'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'com.squareup:seismic:1.0.3'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3'

    implementation project(path: ":puzlib", configuration: 'shadow')

    annotationProcessor "androidx.room:room-compiler:$room_version"
    // thanks: https://stackoverflow.com/a/72105049
    annotationProcessor "com.google.dagger:hilt-compiler:$hilt_version"
    annotationProcessor "androidx.hilt:hilt-compiler:1.2.0"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'

    testImplementation 'junit:junit:4.13.2'
    // thanks https://stackoverflow.com/a/30759769
    testImplementation 'org.json:json:20080701'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'

    // To avoid duplicate classes pulled in by libraries
    // https://stackoverflow.com/a/75298544/6882587
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
}

