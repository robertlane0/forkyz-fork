stages:
  - build
  - release
  - pages

build_android:
  stage: build
  image: fabernovel/android:api-35-v1.10.1
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './'
  script:
    - apt update
    - apt install -y curl openjdk-17-jdk-headless
    - update-alternatives --auto java
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - ./gradlew assembleRelease --no-daemon
  after_script:
    - echo "ANDROID_APP_URL=https://gitlab.com/Hague/forkyz/-/jobs/$CI_JOB_ID/artifacts/raw/app/build/outputs/apk/release/app-release.apk" >> android_job.env
  artifacts:
    paths:
      - app/build/outputs/apk/release
    expire_in: never
    reports:
      dotenv: android_job.env

build_linux:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './'
  script:
    - apt update
    - apt install -y curl openjdk-17-jdk binutils fakeroot
    - update-alternatives --auto java
    - ./gradlew packageReleaseDeb
    - ./gradlew packageReleaseUberJarForCurrentOS
    - ./gradlew --stop
  after_script:
    - export APP_VERSION=$(echo $CI_COMMIT_TAG | sed 's/\(v\|alpha\)\([0-9]*\).*/\2/')
    - echo "DEB_APP_URL=https://gitlab.com/Hague/forkyz/-/jobs/$CI_JOB_ID/artifacts/raw/app/build/compose/binaries/main-release/deb/app.crossword.yourealwaysbe.forkyz_${APP_VERSION}.0.0-1_amd64.deb" >> linux_job.env
    - echo "DEB_JAR_URL=https://gitlab.com/Hague/forkyz/-/jobs/$CI_JOB_ID/artifacts/raw/app/build/compose/jars/app.crossword.yourealwaysbe.forkyz-linux-x64-${APP_VERSION}.0.0-release.jar" >> linux_job.env
  artifacts:
    paths:
      - app/build/compose/binaries/main-release/deb
      - app/build/compose/jars
    expire_in: never
    reports:
      dotenv: linux_job.env

