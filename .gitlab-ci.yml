stages:
  - build
  - release
  - pages

build_android:
  stage: build
  image: fabernovel/android:api-35-v1.10.1
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './'
  script:
    - apt update
    - apt install -y curl openjdk-17-jdk-headless
    - update-alternatives --auto java
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - ./gradlew assembleRelease --no-daemon
  after_script:
    - echo "ANDROID_APP_URL=https://gitlab.com/Hague/forkyz/-/jobs/$CI_JOB_ID/artifacts/raw/androidApp/build/outputs/apk/release/androidApp-release.apk" >> android_job.env
  artifacts:
    paths:
      - androidApp/build/outputs/apk/release
    expire_in: never
    reports:
      dotenv: android_job.env

build_flatpak:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './'
  script:
    - export APP_VERSION=$(echo $CI_COMMIT_TAG | sed 's/\(v\|alpha\)\([0-9]*\).*/\2/')
    - apt update
    - apt install -y curl binutils fakeroot flatpak-builder
    - flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
    - flatpak install --assumeyes org.freedesktop.Platform//25.08
    - flatpak install --assumeyes org.freedesktop.Sdk//25.08
    - flatpak install --assumeyes org.freedesktop.Sdk.Extension.openjdk17//25.08
    - pushd flatpak
    - flatpak-builder --repo=repo-local build-local local-manifest.json
    - flatpak build-bundle repo-local forkyz-${APP_VERSION}.flatpak com.gitlab.Hague.forkyz --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
    - mkdir share
    - mv forkyz-${APP_VERSION}.flatpak share/
  after_script:
    - export APP_VERSION=$(echo $CI_COMMIT_TAG | sed 's/\(v\|alpha\)\([0-9]*\).*/\2/')
    - echo "FLATPAK_URL=https://gitlab.com/Hague/forkyz/-/jobs/$CI_JOB_ID/artifacts/raw/flatpak/share/forkyz-${APP_VERSION}.flatpak" >> flatpak_job.env
  artifacts:
    paths:
      - flatpak/share
    expire_in: never
    reports:
      dotenv: flatpak_job.env

build_linux:
  stage: build
  image: ubuntu:24.04
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './'
  script:
    - export APP_VERSION=$(echo $CI_COMMIT_TAG | sed 's/\(v\|alpha\)\([0-9]*\).*/\2/')
    - apt update
    - apt install -y curl openjdk-17-jdk binutils fakeroot
    - update-alternatives --auto java
    - ./gradlew packageReleaseDeb
    - ./gradlew packageReleaseUberJarForCurrentOS
    - ./gradlew --stop
  after_script:
    - export APP_VERSION=$(echo $CI_COMMIT_TAG | sed 's/\(v\|alpha\)\([0-9]*\).*/\2/')
    - echo "DEB_APP_URL=https://gitlab.com/Hague/forkyz/-/jobs/$CI_JOB_ID/artifacts/raw/composeApp/build/compose/binaries/main-release/deb/app.crossword.yourealwaysbe.forkyz_${APP_VERSION}.0.0-1_amd64.deb" >> linux_job.env
    - echo "DEB_JAR_URL=https://gitlab.com/Hague/forkyz/-/jobs/$CI_JOB_ID/artifacts/raw/composeApp/build/compose/jars/app.crossword.yourealwaysbe.forkyz-linux-x64-${APP_VERSION}.0.0-release.jar" >> linux_job.env
  artifacts:
    paths:
      - composeApp/build/compose/binaries/main-release/deb
      - composeApp/build/compose/jars
    expire_in: never
    reports:
      dotenv: linux_job.env

