build_windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    SECURE_FILES_DOWNLOAD_PATH: './'
  script:
    - ./gradlew packageReleaseMsi --no-daemon
    - ./gradlew packageReleaseUberJarForCurrentOS
    - ./gradlew --stop
  after_script:
    - $env:APP_VERSION = $env:CI_COMMIT_TAG -replace '^(v|alpha)(\d+).*','$2'
    - Add-Content -Path windows_job.env -Value "WINDOWS_APP_URL=https://gitlab.com/Hague/forkyz/-/jobs/$env:CI_JOB_ID/artifacts/raw/app/build/compose/binaries/main-release/msi/app.crossword.yourealwaysbe.forkyz-$($env:APP_VERSION).0.0.msi"
    - Add-Content -Path windows_job.env -Value "WINDOWS_JAR_URL=https://gitlab.com/Hague/forkyz/-/jobs/$env:CI_JOB_ID/artifacts/raw/app/build/compose/jars/app.crossword.yourealwaysbe.forkyz-windows-x64-$($env:APP_VERSION).0.0-release.jar"
  artifacts:
    paths:
      - app/build/compose/binaries/main-release/msi
      - app/build/compose/jars
    expire_in: never
    reports:
      dotenv: windows_job.env

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_android
      artifacts: true
    - job: build_linux
      artifacts: true
#    - job: build_mac
#      artifacts: true
    - job: build_windows
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - export APP_VERSION=$(echo $CI_COMMIT_TAG | sed 's/\(v\|alpha\)\([0-9]*\).*/\2/')
    - export CHANGELOG_FILE="${APP_VERSION}00000.txt"
    - export CHANGELOG_PATH="fastlane/metadata/android/en-US/changelogs/$CHANGELOG_FILE"
    - touch release_changelog.txt
    - |
      if [ -f "$CHANGELOG_PATH" ]
      then
        echo -e "# Changes\n" > release_changelog.txt
        cat "$CHANGELOG_PATH" >> release_changelog.txt
      fi
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'release_changelog.txt'
    assets:
      links:
        - name: App APK Install File
          direct_asset_path: /apk
          url: "$ANDROID_APP_URL"
        - name: Linux (.deb) Install File
          direct_asset_path: /deb
          url: "$DEB_APP_URL"
#        - name: Mac Install File
#          direct_asset_path: /dmg
#          url: "$DMG_APP_URL"
        - name: Windows Install File
          direct_asset_path: /msi
          url: "$WINDOWS_APP_URL"
        - name: Linux Java Jar File
          direct_asset_path: /linuxjar
          url: "$DEB_JAR_URL"
#        - name: Mac Java Jar File
#          direct_asset_path: /macjar
#          url: "$DMG_JAR_URL"
        - name: Windows Java Jar File
          direct_asset_path: /windowsjar
          url: "$WINDOWS_JAR_URL"

pages:
  stage: pages
  image: node:lts
  script:
    - npm install showdown
    - cd docs
    - ./generate.sh
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
